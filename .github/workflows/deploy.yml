name: CI/CD Build and Deploy via Coolify

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Push, and Trigger Deploy
    runs-on: [self-hosted, raspberry-pi]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          OWNER="${{ github.repository_owner }}"
          IMAGE=ghcr.io/${OWNER,,}/next-jay-portfolio
          docker build \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: Trigger Coolify Redeploy
        run: curl -fsSL -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}"

      - name: Clean Up Stale Docker Images
        run: docker image prune -f
