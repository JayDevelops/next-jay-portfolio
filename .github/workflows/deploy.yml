name: CI/CD Build and Deploy via Coolify

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Push, and Trigger Deploy
    runs-on: [self-hosted, raspberry-pi]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # amd64 is the server target (QEMU emulates amd64 on the arm64 Pi)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # buildx is required for --platform cross-builds and gha caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/next-jay-portfolio" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Redeploy
        run: |
          if [ -z "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" ]; then
            echo "::error::COOLIFY_DEPLOY_WEBHOOK secret is not set"
            exit 1
          fi
          curl -fsSL -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}"

      - name: Clean Up Stale Docker Images
        run: docker image prune -f
