name: CI/CD Build and Deploy via Coolify

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Push, and Trigger Deploy
    runs-on: [self-hosted, raspberry-pi]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # amd64 is the server target
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # buildx is required for --platform cross-builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          OWNER="${{ github.repository_owner }}"
          IMAGE=ghcr.io/${OWNER,,}/next-jay-portfolio
          docker buildx build \
            --platform linux/amd64 \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} \
            --push \
            .

      - name: Trigger Coolify Redeploy
        run: |
          if [ -z "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" ]; then
            echo "::error::COOLIFY_DEPLOY_WEBHOOK secret is not set"
            exit 1
          fi
          curl -fsSL -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}"

      - name: Clean Up Stale Docker Images
        run: docker image prune -f
